name: EDITHA
version: "0.39.1"
slug: editha
description: "Smart file editor for Home Assistant"
url: https://github.com/Trizompa/ha-addons/tree/main/editha
stage: experimental
arch:
  - aarch64
  - amd64
init: false
# Ready-made images (Publish images workflow): installs and updates are a download, not a build.
image: "ghcr.io/trizompa/{arch}-addon-editha"

# Solo Ingress: nessuna porta esposta sull'host.
ingress: true
ingress_port: 8099
panel_icon: mdi:pencil
panel_title: EDITHA

# API di Core tramite il proxy del Supervisor (entità, servizi, verifica, ricarica, riavvio).
homeassistant_api: true

# Unico percorso dell'utente montato nel container.
map:
  - type: homeassistant_config
    read_only: false
    path: /config

options: {}
schema: {}
