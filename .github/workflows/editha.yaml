name: Editha

on:
  workflow_dispatch:
  push:
    paths:
      - "editha/**"
      - ".github/workflows/editha.yaml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "editha/**"
      - ".github/workflows/editha.yaml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editha/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editha/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editha/server/package-lock.json
            editha/web/package-lock.json
      - name: Dependencies
        run: |
          npm ci --prefix editha/server
          npm ci --prefix editha/web
      - name: Type check and unit tests
        working-directory: editha/web
        run: |
          npm run typecheck
          npm test
      - name: Test browser
        working-directory: editha/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests (e2e)
        working-directory: editha/web
        run: npm run test:e2e
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            editha/web/playwright-report
            editha/web/test-results
          retention-days: 7

  build:
    # ENG-4 / ENG-7: the image must build on both architectures,
    # with the same base image the Supervisor uses.
    name: Build ${{ matrix.arch }}
    # aarch64 on a native ARM runner (free for public repositories): no emulation.
    runs-on: ${{ matrix.runner }}
    needs: [test, web]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: |
          docker buildx build editha \
            --platform ${{ matrix.platform }} \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/base:3.22 \
            --load --tag editha:${{ matrix.arch }}
      - name: Start and access check
        # Reproduces the Supervisor network: the Ingress proxy has address 172.30.32.2
        # and the server uses the default configuration (EDITHA_ALLOWED_IPS not set).
        run: |
          image=editha:${{ matrix.arch }}
          platform=${{ matrix.platform }}
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/data"
          echo "homeassistant:" > "$RUNNER_TEMP/config/configuration.yaml"
          docker network create --subnet 172.30.32.0/23 hassio
          # Like the Supervisor: the token arrives as a container environment variable.
          docker run -d --name editha --network hassio --ip 172.30.33.10 --platform "$platform" \
            -e SUPERVISOR_TOKEN=token-di-prova \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/data:/data" "$image"
          probe() {
            docker run --rm --network hassio --ip "$1" --platform "$platform" --entrypoint wget "$image" \
              -q -T 5 -O - "http://172.30.33.10:8099$2"
          }
          for i in $(seq 1 30); do
            if probe 172.30.32.2 /api/health; then break; fi
            if [ "$i" = 30 ]; then echo "the server does not respond"; exit 1; fi
            sleep 2
          done
          echo
          probe 172.30.32.2 /api/tree
          echo
          probe 172.30.32.2 / | grep -q "<editha-app>"
          echo "web interface served"
          # Editha must see the token even when startup goes through s6-overlay.
          probe 172.30.32.2 /api/ha/status | grep -q '"available":true'
          echo "Supervisor token visible"
          if probe 172.30.33.50 /api/health; then
            echo "an address other than the Ingress proxy must not be accepted"
            exit 1
          fi
          echo "external address correctly rejected"
      - name: AppArmor profile (enforced)
        # SEC-10: the GitHub runners have AppArmor turned on, like Home Assistant OS. The profile
        # is loaded into the kernel and the app runs under it, as the Supervisor does.
        if: matrix.arch == 'amd64'
        run: |
          image=editha:${{ matrix.arch }}
          sudo aa-enabled
          sudo apparmor_parser -r -W editha/apparmor.txt
          cfg="$RUNNER_TEMP/aa-config"
          data="$RUNNER_TEMP/aa-data"
          mkdir -p "$cfg/.storage" "$data"
          echo "homeassistant:" > "$cfg/configuration.yaml"
          echo "a: 1" > "$cfg/other_user.yaml"
          echo "{}" > "$cfg/.storage/core.config"
          # A file that belongs to another user: saving it needs dac_override, keeping its owner chown.
          sudo chown 1000:1000 "$cfg/other_user.yaml"
          sudo dmesg --clear
          docker run -d --name editha-aa --network hassio --ip 172.30.33.11 \
            --security-opt apparmor=editha -e SUPERVISOR_TOKEN=token-di-prova \
            -v "$cfg:/config" -v "$data:/data" "$image"
          test "$(docker inspect -f '{{.AppArmorProfile}}' editha-aa)" = editha
          docker run --rm --network hassio --ip 172.30.32.2 --entrypoint node \
            -v "$GITHUB_WORKSPACE/.github/scripts:/scripts:ro" "$image" \
            /scripts/apparmor-check.mjs http://172.30.33.11:8099
          test "$(sudo stat -c '%u:%g' "$cfg/other_user.yaml")" = 1000:1000
          echo "owner of other_user.yaml kept"
          # What the profile must block: system folders and the app's own code.
          if docker exec editha-aa sh -c 'echo x > /config/.storage/core.config'; then
            echo "writing to /config/.storage must be denied"; exit 1
          fi
          if docker exec editha-aa mv /config/.storage /config/storage-moved; then
            echo "renaming /config/.storage must be denied"; exit 1
          fi
          if docker exec editha-aa sh -c 'echo x > /app/dist/main.js'; then
            echo "writing to the app's code must be denied"; exit 1
          fi
          echo "system folders and app code are protected"
          docker stop -t 20 editha-aa
          # The two blocks above must come from AppArmor (not from file permissions)…
          sudo dmesg | grep 'apparmor="DENIED"' | grep 'profile="editha' > all-denied.txt || true
          cat all-denied.txt
          grep -q 'name="/config/.storage/core.config"' all-denied.txt
          grep -q 'name="/config/.storage/"' all-denied.txt
          grep -q 'name="/app/dist/main.js"' all-denied.txt
          # Dropped kernel messages would hide denials.
          if sudo dmesg | grep -q -e 'callbacks suppressed' -e 'rate limit exceeded'; then
            echo "kernel messages were dropped, the check is not reliable"; exit 1
          fi
          # …and nothing else may have been denied (start, features, stop).
          grep -v -e 'name="/config/.storage/' -e 'name="/app/dist/main.js"' all-denied.txt > denied.txt || true
          if [ -s denied.txt ]; then
            echo "unexpected AppArmor denials:"; cat denied.txt; exit 1
          fi
          echo "no unexpected AppArmor denials"
      - name: Server log
        if: always()
        run: |
          docker logs editha || true
          docker logs editha-aa || true
