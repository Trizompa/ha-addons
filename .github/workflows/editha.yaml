name: Editha

on:
  # Manual run (Actions → Editha → Run workflow): also builds the aarch64 image.
  workflow_dispatch:
  push:
    paths:
      - "editha/**"
      - ".github/workflows/editha.yaml"
  pull_request:
    paths:
      - "editha/**"
      - ".github/workflows/editha.yaml"

permissions:
  contents: read

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editha/server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editha/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editha/server/package-lock.json
            editha/web/package-lock.json
      - name: Dependencies
        run: |
          npm ci --prefix editha/server
          npm ci --prefix editha/web
      - name: Type check and unit tests
        working-directory: editha/web
        run: |
          npm run typecheck
          npm test
      - name: Test browser
        working-directory: editha/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests (e2e)
        working-directory: editha/web
        run: npm run test:e2e
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            editha/web/playwright-report
            editha/web/test-results
          retention-days: 7

  build:
    # ENG-4 / ENG-7: the image must build on both architectures,
    # with the same base image the Supervisor uses.
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [test, web]
    # The aarch64 build is emulated (QEMU): slow, sometimes hangs, and uses up GitHub Actions
    # minutes. It only runs manually (workflow_dispatch); every push builds amd64.
    # Each attempt has a time limit, and up to three attempts are made.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"arch":"amd64","platform":"linux/amd64"},{"arch":"aarch64","platform":"linux/arm64"}]' || '[{"arch":"amd64","platform":"linux/amd64"}]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        # On the device the Supervisor builds without emulation: the problem is only here.
        run: |
          for attempt in 1 2 3; do
            if timeout 15m docker buildx build editha \
              --platform ${{ matrix.platform }} \
              --build-arg BUILD_FROM=ghcr.io/home-assistant/base:3.22 \
              --load --tag editha:${{ matrix.arch }}; then
              exit 0
            fi
            echo "::warning::Build ${{ matrix.arch }}, attempt $attempt failed or hung: retrying"
          done
          exit 1
      - name: Start and access check
        # Reproduces the Supervisor network: the Ingress proxy has address 172.30.32.2
        # and the server uses the default configuration (EDITHA_ALLOWED_IPS not set).
        run: |
          image=editha:${{ matrix.arch }}
          platform=${{ matrix.platform }}
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/data"
          echo "homeassistant:" > "$RUNNER_TEMP/config/configuration.yaml"
          docker network create --subnet 172.30.32.0/23 hassio
          # Like the Supervisor: the token arrives as a container environment variable.
          docker run -d --name editha --network hassio --ip 172.30.33.10 --platform "$platform" \
            -e SUPERVISOR_TOKEN=token-di-prova \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/data:/data" "$image"
          probe() {
            docker run --rm --network hassio --ip "$1" --platform "$platform" --entrypoint wget "$image" \
              -q -T 5 -O - "http://172.30.33.10:8099$2"
          }
          for i in $(seq 1 30); do
            if probe 172.30.32.2 /api/health; then break; fi
            if [ "$i" = 30 ]; then echo "the server does not respond"; exit 1; fi
            sleep 2
          done
          echo
          probe 172.30.32.2 /api/tree
          echo
          probe 172.30.32.2 / | grep -q "<editha-app>"
          echo "web interface served"
          # Editha must see the token even when startup goes through s6-overlay.
          probe 172.30.32.2 /api/ha/status | grep -q '"available":true'
          echo "Supervisor token visible"
          if probe 172.30.33.50 /api/health; then
            echo "an address other than the Ingress proxy must not be accepted"
            exit 1
          fi
          echo "external address correctly rejected"
      - name: Server log
        if: always()
        run: docker logs editha || true
